spring:
  application:
    name: restDemo

  datasource:
    url: jdbc:mysql://localhost:3306?allowPublicKeyRetrieval=true&useSSL=false
#    driver-class-name: org.h2.Driver
    username: root
    password: root

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

#  h2:
#    console:
#      enabled: true
#      path: /h2-console

server:
  port: 8001

logging:
  level:
    root: INFO
    com.example.restdemo: DEBUG
    org.hibernate.SQL: DEBUG

  file:
    path: logs

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      [${spring.application.name}]
      [%thread]
      %-5level
      %logger{36}
      - %msg%n

    file: >
      %d{yyyy-MM-dd HH:mm:ss}
      [${spring.application.name}]
      [%thread]
      %-5level
      %logger{36}
      - %msg%n